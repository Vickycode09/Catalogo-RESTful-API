<section class="page">
  <header class="hero">
    <p class="eyebrow">CATÁLOGO DE POKÉMON</p>
    <h1>Explora la Pokédex</h1>
    <p class="intro">Descubre los primeros Pokémon y sus características.</p>
  </header>

  @if (cargando()) {
    <p class="status" role="status">Cargando Pokémon...</p>
  } @else if (error()) {
    <p class="status error" role="alert">{{ error() }}</p>
  } @else {
    <section class="pokemon-grid" aria-label="Pokémon">
      @for (personaje of personajes(); track personaje.id) {
        <app-tarjeta [personaje]="personaje" />
      } @empty {
        <p class="status">No hay resultados.</p>
      }
    </section>
  }
</section>
